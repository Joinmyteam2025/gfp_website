    <!-- Sandbox storage shim. Reading localStorage, sessionStorage, or
         document.cookie throws SecurityError in a sandboxed iframe without
         allow-same-origin. Replace those natives before any other script. -->
    <script>
      (function () {
        function memoryStorage() {
          var m = {};
          return {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(m, String(k)) ? m[String(k)] : null; },
            setItem: function (k, v) { m[String(k)] = String(v); },
            removeItem: function (k) { delete m[String(k)]; },
            clear: function () { m = {}; },
            key: function (i) { var ks = Object.keys(m); return i < ks.length ? ks[i] : null; },
            get length() { return Object.keys(m).length; }
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          var usable = false;
          try {
            var s = window[name];
            s.setItem("__probe__", "1");
            s.removeItem("__probe__");
            usable = true;
          } catch (e) { usable = false; }
          if (!usable) {
            try {
              Object.defineProperty(window, name, {
                value: memoryStorage(), configurable: true, writable: true
              });
            } catch (e2) { /* nothing more we can do */ }
          }
        });
        try { void document.cookie; }
        catch (e) {
          var jar = "";
          try {
            Object.defineProperty(document, "cookie", {
              get: function () { return jar; },
              set: function (v) { jar = jar ? jar + "; " + String(v).split(";")[0] : String(v).split(";")[0]; },
              configurable: true
            });
          } catch (e2) { /* nothing more we can do */ }
        }
      })();
    </script>

    <!-- GFP Event Tracking Layer -->
    <script>
      window.GFP = window.GFP || {};
      GFP.track = function(eventName, data) {
        // Meta Pixel
        if (typeof fbq !== 'undefined') fbq('trackCustom', eventName, data || {});
        // GA4 (will activate once gtag is loaded)
        if (typeof gtag !== 'undefined') gtag('event', eventName, data || {});
        // Console log for debugging
        console.log('[GFP Track]', eventName, data);
      };
      // Auto-track all "Speak to Us" button clicks
      document.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (btn && btn.textContent.trim().indexOf('Speak to Us') !== -1) {
          GFP.track('speak_to_us_click', {
            page: window.location.pathname,
            source: btn.closest('section')?.id || 'unknown'
          });
          if (typeof fbq !== 'undefined') fbq('track', 'Contact');
        }
      });
      // Track page visibility and time on page
      var pageStart = Date.now();
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          var timeOnPage = Math.round((Date.now() - pageStart) / 1000);
          GFP.track('page_engagement', {
            page: window.location.pathname,
            seconds: timeOnPage
          });
        }
      });
    </script>

    <!-- Hide the Vapi floating bubble on ALL devices (we render our own button).
         The widget still works when opened programmatically via openVapiWidget(). -->
    <style>
      vapi-widget:not([open]) { 
        width: 0 !important; height: 0 !important; 
        overflow: hidden !important; opacity: 0 !important; 
        pointer-events: none !important; position: fixed !important;
      }
      /* Custom floating "Speak to Us" button - replaces Vapi's off-center one */
      #gfp-speak-btn {
        position: fixed; bottom: 24px; right: 24px; z-index: 9998;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 14px 28px;
        background: linear-gradient(135deg, #C5963A 0%, #D4A94E 100%);
        color: #fff; font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
        border: none; border-radius: 999px; cursor: pointer;
        box-shadow: 0 4px 20px rgba(197, 150, 58, 0.35), 0 2px 8px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
      }
      #gfp-speak-btn:hover {
        background: linear-gradient(135deg, #D4A94E 0%, #C5963A 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 28px rgba(197, 150, 58, 0.45), 0 4px 12px rgba(0,0,0,0.25);
      }
      #gfp-speak-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
      /* On mobile, hide the floating button (navbar CTA handles it) */
      @media (max-width: 1023px) {
        #gfp-speak-btn { display: none !important; }
      }
    </style>

    <!-- Global helper: open Vapi widget from any button + fix widget styling + fallback chat -->
    <script>
      window._vapiReady = false;

      /* Wait for Vapi widget to initialize (we hide its button, but need it for chat/voice) */
      (function waitForVapi() {
        var widget = document.querySelector('vapi-widget');
        if (!widget) {
          if (window._vapiRetries === undefined) window._vapiRetries = 0;
          window._vapiRetries++;
          if (window._vapiRetries < 30) return setTimeout(waitForVapi, 500);
          console.warn('[GFP] Vapi widget failed to load after 15s — fallback chat enabled');
          return;
        }
        window._vapiReady = true;
        console.log('[GFP] Vapi widget ready (custom button active)');
      })();

      /* ── Fallback Chat Panel (shown when Vapi is unavailable) ── */
      function _createFallbackChat() {
        if (document.getElementById('gfp-fallback-chat')) return;
        var overlay = document.createElement('div');
        overlay.id = 'gfp-fallback-chat';
        overlay.innerHTML = [
          '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:99998" onclick="document.getElementById(\'gfp-fallback-chat\').remove()"></div>',
          '<div style="position:fixed;bottom:24px;right:24px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);background:linear-gradient(135deg,#0B1D3A,#0F2240);border:1px solid rgba(197,150,58,0.3);border-radius:20px;z-index:99999;box-shadow:0 25px 60px rgba(0,0,0,0.5);overflow:hidden;display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif">',
            '<div style="padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between">',
              '<div>',
                '<div style="font-size:16px;font-weight:700;color:#fff">Chat with Ashley</div>',
                '<div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px">Garner Financial Partners</div>',
              '</div>',
              '<button onclick="document.getElementById(\'gfp-fallback-chat\').remove()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.5);cursor:pointer;padding:6px 10px;font-size:14px">&times;</button>',
            '</div>',
            '<div style="flex:1;padding:20px;overflow-y:auto">',
              '<div style="background:rgba(197,150,58,0.1);border:1px solid rgba(197,150,58,0.2);border-radius:16px;border-top-left-radius:4px;padding:14px 16px;margin-bottom:16px;max-width:90%">',
                '<p style="color:rgba(255,255,255,0.8);font-size:14px;line-height:1.5;margin:0">It\'s a great day at Garner Financial Partners, my name is Ashley, what can I get you information on? Our voice assistant is temporarily unavailable, but I\'d love to help! Send us a message below or reach out directly.</p>',
              '</div>',
              '<form id="gfp-fallback-form" style="display:flex;flex-direction:column;gap:12px" onsubmit="return _handleFallbackSubmit(event)">',
                '<input name="name" placeholder="Your name" required style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;width:100%;box-sizing:border-box" />',
                '<input name="email" type="email" placeholder="Email address" required style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;width:100%;box-sizing:border-box" />',
                '<input name="phone" type="tel" placeholder="Phone number" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;width:100%;box-sizing:border-box" />',
                '<textarea name="message" placeholder="How can we help?" rows="3" required style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;resize:none;width:100%;box-sizing:border-box"></textarea>',
                '<button type="submit" style="background:#C5963A;color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s" onmouseover="this.style.background=\'#9E7730\'" onmouseout="this.style.background=\'#C5963A\'">Send Message</button>',
              '</form>',
              '<div id="gfp-fallback-success" style="display:none;text-align:center;padding:20px">',
                '<div style="font-size:32px;margin-bottom:8px">\u2705</div>',
                '<div style="color:#fff;font-weight:600;font-size:16px;margin-bottom:4px">Message Sent!</div>',
                '<div style="color:rgba(255,255,255,0.4);font-size:13px">We\'ll get back to you shortly.</div>',
              '</div>',
            '</div>',
            '<div style="padding:12px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;gap:16px">',
              '<a href="tel:+15204626447" style="color:#C5963A;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:4px">\u260E (520) 462-6447</a>',
              '<span style="color:rgba(255,255,255,0.15)">|</span>',
              '<a href="mailto:contact@garnerfinancialpartners.com" style="color:#C5963A;font-size:13px;text-decoration:none">\u2709 Email Us</a>',
            '</div>',
          '</div>'
        ].join('');
        document.body.appendChild(overlay);
      }

      function _handleFallbackSubmit(e) {
        e.preventDefault();
        var form = document.getElementById('gfp-fallback-form');
        var data = new FormData(form);
        // Send via mailto as fallback
        var subject = encodeURIComponent('Website Chat - ' + data.get('name'));
        var body = encodeURIComponent(
          'Name: ' + data.get('name') + '\n' +
          'Email: ' + data.get('email') + '\n' +
          'Phone: ' + (data.get('phone') || 'N/A') + '\n\n' +
          'Message:\n' + data.get('message')
        );
        window.open('mailto:contact@garnerfinancialpartners.com?subject=' + subject + '&body=' + body, '_blank');
        form.style.display = 'none';
        document.getElementById('gfp-fallback-success').style.display = 'block';
        return false;
      }

      /* Open the Vapi chat/voice panel — falls back to chat panel if Vapi unavailable */
      window.openVapiWidget = function() {
        var customBtn = document.getElementById('gfp-speak-btn');
        var widget = document.querySelector('vapi-widget');

        // Temporarily show the widget so it can open its panel
        if (widget) {
          widget.style.cssText = 'width:0!important;height:0!important;overflow:hidden!important;opacity:0!important;pointer-events:none!important;position:fixed!important;';
        }

        // If widget exists and has loaded its shadow DOM, try to open it
        if (widget && widget.shadowRoot) {
          if (customBtn) customBtn.style.display = 'none';
          if (typeof widget.open === 'function') { widget.open(); }
          else {
            widget.setAttribute('open', '');
            var btn = widget.shadowRoot.querySelector('button');
            if (btn) { btn.click(); }
          }
          // Re-show our custom button when widget closes
          var observer = new MutationObserver(function() {
            if (!widget.hasAttribute('open')) {
              if (customBtn && window.innerWidth >= 1024) customBtn.style.display = '';
              observer.disconnect();
            }
          });
          observer.observe(widget, { attributes: true, attributeFilter: ['open'] });
          return;
        }

        // Vapi not available — show fallback chat
        console.log('[GFP] Vapi unavailable, opening fallback chat');
        if (customBtn) customBtn.style.display = 'none';
        _createFallbackChat();
      };
    </script>
